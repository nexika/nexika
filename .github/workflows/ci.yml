name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: test (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.12", "3.14"]
        include:
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: pytest

  validate:
    name: claude plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - name: Validate each plugin manifest
        run: |
          for manifest in plugins/*/.claude-plugin/plugin.json; do
            claude plugin validate "$manifest"
          done
      - name: Mod tests (claude plugin test)
        run: |
          for plugin in plugins/*/; do
            if [ -n "$(find "$plugin" -name '*.test.ts' -o -name '*.test.tsx' | head -1)" ]; then
              claude plugin test "$plugin"
            fi
          done

  # The engine is self-contained Node code, so PRs that don't touch it, the benchmarks
  # that use it, or this file skip its browser tests. Pushes to main always run them.
  changes:
    name: detect lawha engine changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.diff.outputs.engine }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/$BASE...HEAD" | grep -qE '^(plugins/lawha/engine/|benchmarks/|\.github/workflows/ci\.yml$)'; then
            echo "engine=true" >> "$GITHUB_OUTPUT"
          else
            echo "engine=false" >> "$GITHUB_OUTPUT"
          fi

  lawha-engine:
    name: lawha engine (build + browser tests)
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.engine == 'true')
    runs-on: ubuntu-latest
    # Playwright's browser download can hang; fail fast so a re-run is the fix, not a 6h wait.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/lawha/engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Build, and fail if the committed dist/ is out of date
        run: |
          npm run build
          git diff --exit-code -- dist || { echo "dist/ is out of date: run npm run build in plugins/lawha/engine and commit it"; exit 1; }
      - run: npm test

  changelog:
    name: change notes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Each changed plugin has a change note
        env:
          BASE: ${{ github.base_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: python3 plugins/amin/bin/amin check-fragment --base "origin/$BASE" --labels "$LABELS"

  # Single required check for branch protection: passes only if every job above passed
  # (a skipped job, like change notes on push or lawha engine on an unrelated PR, does not fail it).
  ci-ok:
    name: CI passed
    if: always()
    needs: [lint, test, validate, changes, lawha-engine, changelog]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "A required job failed or was cancelled."; exit 1
          fi
