[project]
name = "nexika"
version = "0.2.0"
description = "Nexika - plugins for Claude Code. Dev tooling only; plugins ship as plain files."
requires-python = ">=3.10"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 110
extend-exclude = [".ruff_cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/test_manar.py" = ["E501"]  # HTML fixtures are naturally long lines
"plugins/bayan/bayan/rules.py" = ["E501"]  # word lists with long Arabic and English phrases
"tests/test_bayan.py" = ["E501"]           # sample texts are naturally long lines
"tests/test_hafiz.py" = ["E501"]           # sample transcripts are naturally long lines
"plugins/mizan/mizan/i18n.py" = ["E501"]   # English and Arabic phrase table
"plugins/tabib/tabib/i18n.py" = ["E501"]   # English and Arabic phrase table
"tests/test_mizan.py" = ["E501"]           # sample payloads and band lines are naturally long lines
"tests/test_tabib.py" = ["E501"]           # sample CI log lines are naturally long lines
"tests/test_lawha_family.py" = ["E501"]    # sample lawha records are naturally long lines
