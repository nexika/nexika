<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Icons</title>
<style>
  body { margin: 0; padding: 24px; font: 18px/1.5 system-ui, sans-serif; background: #fff; color: #111; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; }
  a, button { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 1px solid #555; border-radius: 6px; background: #fff; color: #111; font: inherit; text-decoration: none; }
  svg { width: 20px; height: 20px; }
  /* Mirrored correctly in RTL: the back chevron and the Material arrow. Wrongly: the play button. */
  [dir="rtl"] .flip-rtl { transform: scaleX(-1); }
  /* Tailwind 4 style: the separate rotate and scale properties. */
  [dir="rtl"] .rotate-rtl { rotate: 180deg; }
  [dir="rtl"] .scale-rtl { scale: -1 1; }
  .material-symbols-outlined { font-family: monospace; font-size: 14px; width: 20px; overflow: hidden; display: inline-block; }
</style></head>
<body>
  <div class="row">
    <a href="#next">Next <svg class="lucide lucide-arrow-right" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" fill="none"/></svg></a>
    <a href="#back"><svg class="lucide lucide-chevron-left flip-rtl" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" stroke="currentColor" fill="none"/></svg> Back</a>
    <button type="button"><svg class="lucide lucide-play flip-rtl" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5l12 7-12 7z" fill="currentColor"/></svg> Play</button>
    <a href="#more">Read more <span aria-hidden="true">→</span></a>
    <a href="#up" style="display:inline-flex">All topics <span aria-hidden="true" class="rotate-rtl">←</span></a>
    <a href="#send">Send <svg class="lucide lucide-send scale-rtl" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12l18-9-6 18-3-7z" fill="currentColor"/></svg></a>
    <a href="#forward">Forward <span class="material-symbols-outlined flip-rtl" aria-hidden="true">arrow_forward</span></a>
    <a href="#go" id="go">Continue <svg class="lucide lucide-arrow-right" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" fill="none"/></svg></a>
  </div>
  <script>
    // An app that swaps the icon itself in RTL (arrow-right becomes arrow-left) is right too.
    new MutationObserver(() => {
      const icon = document.querySelector("#go svg");
      const rtl = document.documentElement.dir === "rtl";
      icon.setAttribute("class", rtl ? "lucide lucide-arrow-left" : "lucide lucide-arrow-right");
    }).observe(document.documentElement, { attributes: true, attributeFilter: ["dir"] });
  </script>
</body></html>
