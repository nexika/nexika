<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Motion, good</title>
<style>
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; background: #fff; color: #111; padding: 24px; }
  .spinner { width: 24px; height: 24px; border: 3px solid #ccd; border-top-color: #1f3a5f; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  h1 { font-size: 40px; margin: 24px 0; }
</style></head>
<body>
  <!-- A small loading spinner (exempt), and a quick entrance that is skipped under reduced motion. -->
  <div class="spinner" role="progressbar" aria-label="Loading"></div>
  <h1 id="title">A quick entrance</h1>
  <p>Body text.</p>
  <script>
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches)
      document.getElementById("title").animate([{ opacity: 0, transform: "translateY(10px)" }, { opacity: 1, transform: "none" }], { duration: 420, easing: "cubic-bezier(0.22, 1, 0.36, 1)" });
  </script>
</body></html>
