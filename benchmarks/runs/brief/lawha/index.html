<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Qalam is a calm writing app for notes, drafts and long essays in Arabic and English." />
    <title>Qalam · a calm editor for Arabic and English</title>
    <script>
      (function () {
        var d = document.documentElement;
        try {
          if (new URLSearchParams(location.search).get("lang") === "ar") {
            d.lang = "ar";
            d.dir = "rtl";
            document.title = "قلم · محرر هادئ للعربية والإنجليزية";
          }
        } catch (e) {}
        var saved = null;
        try { saved = localStorage.getItem("qalam-theme"); } catch (e) {}
        var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) d.classList.add("dark");
        d.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
